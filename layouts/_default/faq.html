{{ define "head" }}
<meta name="description" content="{{ .Params.description }}">
<link rel="stylesheet" href="{{ (printf "%scss/list.css" (.Site.Params.staticPath | default "")) | relURL }}" media="all">
{{ end }}

{{ define "title" }}
{{.Title }} | {{ .Site.Title }}
{{ end }}

{{ define "main" }}
<div class="container pt-5 courses" id="list-page">
  <h2 class="text-center pb-2">{{ .Title }}</h2>
  <div class="row justify-content-center">
    <div class="col-lg-9">
      <div class="course-faq my-4">
        {{ range .Params.faq }}
        <details>
          <summary>{{ .q }}</summary>
          <p>{{ .a | safeHTML }}</p>
        </details>
        {{ end }}
      </div>
      <div class="mb-5">{{ .Content }}</div>
      <p class="mb-5"><a href="/courses/">&larr; All courses and dates</a></p>
    </div>
  </div>
</div>
{{ end }}
